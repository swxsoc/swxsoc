name: Check CHANGELOG is Updated

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read

jobs:
  changelog:
    name: Check CHANGELOG.rst is updated
    runs-on: ubuntu-latest
    # Add the "no-changelog" label to a pull request to skip this check.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG.rst was modified
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.rst'; then
            echo "CHANGELOG.rst has been updated."
          else
            echo "::error file=CHANGELOG.rst::CHANGELOG.rst was not updated in this pull request. Add an entry describing your change, or add the 'no-changelog' label if no entry is needed."
            exit 1
          fi